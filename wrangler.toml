name = "samora-care"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-21"

# Consumed by functions/api/lead.ts. Declared here rather than in the dashboard
# because a project with a wrangler.toml ignores dashboard-defined vars.
[vars]
# Register continues to use the Apps Script/Sheet path.
LEAD_ENDPOINT = "https://script.google.com/macros/s/AKfycbxilAvJyIJH7XgD-Jf_P9za1TzU2sCj5mh8Eo5AfnDziIyIySK5dKHdNYVNsKNEh7Kh/exec"
# The eligibility screener posts here from functions/api/lead.ts.
CARE_LEAD_ENDPOINT = "https://api.samora.ai/v2/public/samora-care/leads"

# Durable landing spot for Register submissions, written before the visitor is
# told the form went through. Declared here because a project with a
# wrangler.toml ignores dashboard bindings.
[[kv_namespaces]]
binding = "LEADS"
id = "c879fa3a5a32405093ae64d1ead422e3"
